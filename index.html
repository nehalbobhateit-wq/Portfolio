  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #07090f; color: #dde4f0; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #07090f; }
    ::-webkit-scrollbar-thumb { background: #00c8a0; border-radius: 2px; }

    @keyframes nb-fadeup { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
    @keyframes nb-pulse  { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(1.15);} }
    @keyframes nb-blink  { 0%,100%{opacity:1;} 50%{opacity:0;} }

    .nb-hero  { animation: nb-fadeup 1s ease forwards; }
    .nb-pulse { animation: nb-pulse 2s infinite; }
    .nb-blink { animation: nb-blink 1s infinite; }

    .nb-nav-btn { transition: color .2s, border-color .2s; cursor:pointer; background:none; border:none; font-family:'DM Sans',sans-serif; }
    .nb-nav-btn:hover { color:#00c8a0 !important; }

    .nb-chip { transition: background .2s, border-color .2s, color .2s, transform .15s; cursor:default; }
    .nb-chip:hover { background:rgba(0,200,160,.18)!important; border-color:#00c8a0!important; color:#00c8a0!important; transform:translateY(-2px) scale(1.03); }

    .nb-card { transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease; }
    .nb-card:hover { transform:translateY(-6px); border-color:rgba(0,200,160,.45)!important; box-shadow:0 24px 48px rgba(0,200,160,.07)!important; }

    .nb-cert { transition: background .2s, border-color .2s, transform .2s; }
    .nb-cert:hover { background:rgba(0,200,160,.08)!important; border-color:rgba(0,200,160,.4)!important; transform:translateX(5px); }

    .nb-exp { transition: border-left-color .3s; }
    .nb-exp:hover { border-left-color:#00c8a0!important; }

    .nb-cta { transition: transform .18s, box-shadow .18s; }
    .nb-cta:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,200,160,.25); }

    .nb-ghost { transition: background .2s, border-color .2s, color .2s, transform .18s; }
    .nb-ghost:hover { background:rgba(0,200,160,.1)!important; border-color:rgba(0,200,160,.5)!important; color:#00c8a0!important; transform:translateY(-2px); }
  </style>
</head>
<body>

      "Programming": ["Java","Python","SQL","HTML","CSS"],

    const EXPERIENCE = [
      {
        company: "Tech Mahindra",
        role: "Software Engineer — QA Accessibility Tester",

          "Execute manual screen reader testing with NVDA, JAWS, and TalkBack — including keyboard navigation and color contrast analysis — to ensure inclusive experiences for users with disabilities.",

    function Portfolio() {

      const [titleIndex, setTitleIndex]       = useState(0);
      const [displayText, setDisplayText]     = useState("");

      /* Typewriter */
      useEffect(() => {
        const current = TITLES[titleIndex];

        if (!isDeleting) {

      useEffect(() => {
        const ids = ["home","about","skills","experience","projects","certifications","education","contact"];
        const fn = () => {
          for (const id of [...ids].reverse()) {
            const el = document.getElementById(id);
            if (el && window.scrollY >= el.offsetTop - 130) { setActiveSection(id); break; }
          }
        };
        window.addEventListener("scroll", fn);
        return () => window.removeEventListener("scroll", fn);

              <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"28px" }}>

              </div>

              </div>
              <p style={{ fontSize:"17px", color:C.muted, lineHeight:1.75, maxWidth:"560px", marginBottom:"44px" }}>

                </div>

                      <div>
